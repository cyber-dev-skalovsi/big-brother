brews:
  - ids: [BIGBROTHER-agent]
    name: BIGBROTHER-agent
    repository:
      owner: cyber-dev-skalovsi
      name: homebrew-big-brother
    homepage: "https://github.com/cyber-dev-skalovsi/big-brother"
    description: "Agent for BIGBROTHER, a lightweight server monitoring platform."
    license: MIT
    skip_upload: '{{ if eq (tolower .Env.IS_FORK) "true" }}true{{ else }}auto{{ end }}'
    extra_install: |
      (bin/"BIGBROTHER-agent-launcher").write <<~EOS
        #!/bin/bash
        set -a
        if [ -f "$HOME/.config/BIGBROTHER/BIGBROTHER-agent.env" ]; then
          source "$HOME/.config/BIGBROTHER/BIGBROTHER-agent.env"
        fi
        set +a
        exec #{bin}/BIGBROTHER-agent "$@"
      EOS
      (bin/"BIGBROTHER-agent-launcher").chmod 0755
    service: |
      run ["#{bin}/BIGBROTHER-agent-launcher"]
      log_path "#{Dir.home}/.cache/BIGBROTHER/BIGBROTHER-agent.log"
      error_log_path "#{Dir.home}/.cache/BIGBROTHER/BIGBROTHER-agent.log"
      keep_alive true
      restart_delay 5
      process_type :background

winget:
  - ids: [BIGBROTHER-agent]
    name: BIGBROTHER-agent
    package_identifier: cyber-dev-skalovsi.BIGBROTHER-agent
    publisher: cyber-dev-skalovsi
    license: MIT
    license_url: "https://github.com/cyber-dev-skalovsi/big-brother/blob/main/LICENSE"
    copyright: "2025 cyber-dev-skalovsi"
    homepage: "https://github.com/cyber-dev-skalovsi/big-brother"
    release_notes_url: "https://github.com/cyber-dev-skalovsi/big-brother/releases/tag/v{{ .Version }}"
    publisher_support_url: "https://github.com/cyber-dev-skalovsi/big-brother/issues"
    short_description: "Agent for BIGBROTHER, a lightweight server monitoring platform."
    skip_upload: '{{ if eq (tolower .Env.IS_FORK) "true" }}true{{ else }}auto{{ end }}'
    description: |
      BIGBROTHER is a lightweight server monitoring platform that includes Docker
      statistics, historical data, and alert functions. It has a friendly web
      interface, simple configuration, and is ready to use out of the box.
      It supports automatic backup, multi-user, OAuth authentication, and
      API access.
    tags:
      - homelab
      - monitoring
      - self-hosted
    repository:
      owner: cyber-dev-skalovsi
      name: big-brother-winget
      branch: cyber-dev-skalovsi.BIGBROTHER-agent-{{ .Version }}
      token: "{{ .Env.WINGET_TOKEN }}"
      # pull_request:
      #   enabled: true
      #   draft: false
      #   base:
      #     owner: microsoft
      #     name: winget-pkgs
      #     branch: master

release:
  draft: true

changelog:
  disable: true
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
